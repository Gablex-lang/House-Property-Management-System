<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Property - House Property System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="topbar">
        <h1>House Property System</h1>
        <a href="dashboard.html" class="btn btn-outline">Back to Dashboard</a>
    </header>

    <main class="container">
        <div class="form-card">
            <h2>Add Property</h2>
            <form id="propertyForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="property_name">Property Name</label>
                        <input type="text" id="property_name" required>
                    </div>
                    <div class="form-group">
                        <label for="property_type">Property Type</label>
                        <select id="property_type" required>
                            <option value="">Select type</option>
                            <option value="House">House</option>
                            <option value="Apartment">Apartment</option>
                            <option value="Condo">Condo</option>
                            <option value="Townhouse">Townhouse</option>
                            <option value="Lot">Lot</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="price">Price (₱)</label>
                        <input type="number" id="price" min="0" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="area">Area (sqm)</label>
                        <input type="number" id="area" min="0" step="0.01" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="bedrooms">Bedrooms</label>
                        <input type="number" id="bedrooms" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="bathrooms">Bathrooms</label>
                        <input type="number" id="bathrooms" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="status">Status</label>
                        <select id="status" required>
                            <option value="Available">Available</option>
                            <option value="Reserved">Reserved</option>
                            <option value="Sold">Sold</option>
                            <option value="Rented">Rented</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="date_listed">Date Listed</label>
                    <input type="date" id="date_listed" required>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" rows="4"></textarea>
                </div>

                <p id="errorMsg" class="error"></p>

                <div class="form-actions">
                    <a href="dashboard.html" class="btn btn-outline">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Property</button>
                </div>
            </form>
        </div>
    </main>

    <script src="js/add-property.js"></script>
</body>
</html>
